name: Feature request
description: Propose a focused improvement to ShardTelemetry
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem independently of a preferred solution.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Embedded retention
        - Server storage
        - Telemetry bridge or export
        - Query and rollups
        - API or integration
        - Build, release, or documentation
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the desired behavior, constraints, and how success should be measured.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for related proposals.
          required: true
        - label: This issue contains no secrets, customer telemetry, or private deterministic-simulation material.
          required: true
        - label: I have read and agree to follow the Code of Conduct.
          required: true

