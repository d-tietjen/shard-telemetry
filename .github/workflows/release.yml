name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Annotated release tag to build (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    name: Build Linux x86_64 release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}
      - name: Validate tag and package version
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "${RELEASE_REF}" = "v${package_version}"
          test "$(git cat-file -t "${RELEASE_REF}")" = tag
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
      - name: Build and test release
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          cargo build --release --locked --bin shard-telemetry-server
      - name: Verify crates.io package
        run: |
          scripts/check-publish-artifacts.sh
          cargo publish --dry-run --locked
      - name: Assemble distribution
        run: |
          version="${RELEASE_REF#v}"
          package="shard-telemetry-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${package}"
          cp target/release/shard-telemetry-server "dist/${package}/"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES README.md CHANGELOG.md SECURITY.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          sha256sum "dist/${package}.tar.gz" > dist/SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/shard-telemetry.spdx.json
          dependency-snapshot: true
      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${RELEASE_REF}"
          dist/*.tar.gz
          dist/SHA256SUMS
          dist/shard-telemetry.spdx.json
          --verify-tag --generate-notes
